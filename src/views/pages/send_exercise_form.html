<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CodeCase</title>
    <link rel="stylesheet" href="/css/main_style.css" />
    <link rel="stylesheet" href="/css/admin_exercise_form.css" />
    <link rel="shortcut icon" href="images/logo.ico" type="image/x-icon">
  </head>
  <body>
    <header class="exercise-form-page__site-header">
      <div class="exercise-form-page__header-content">
        <a href="/" class="exercise-form-page__logo-link">
          <img
            src="/images/codecase.svg"
            alt="CodeCase Logo"
            class="exercise-form-page__logo"
          />
        </a>
        <nav class="exercise-form-page__nav">
          <a href="/" class="exercise-form-page__back-link">Voltar</a>
        </nav>
      </div>
    </header>

    <main class="exercise-form-page">
      <div class="exercise-form-page__container">
        <div class="exercise-form-page__header">
          <h1 id="exercise-form__heading" class="exercise-form-page__title">
            Envie um Exercício
          </h1>
          <p class="exercise-form-page__subtitle">
            Sua sugestão será revisada antes de aparecer na biblioteca pública.
          </p>
        </div>

        <form
          id="exercise-form__editor"
          class="exercise-form"
          enctype="multipart/form-data"
        >
          <input type="hidden" id="exercise-form__id" name="exercise_id" />

          <div class="exercise-form__fields">
            <div class="exercise-form__group">
              <label for="exercise-form__title" class="exercise-form__label"
                >Título do Exercício *</label
              >
              <input
                type="text"
                id="exercise-form__title"
                name="title"
                class="exercise-form__input"
                placeholder="Ex: Algoritmo de Busca Binária"
                required
              />
            </div>

            <div class="exercise-form__group">
              <label for="exercise-form__summary" class="exercise-form__label"
                >Resumo Curto *</label
              >
              <input
                type="text"
                id="exercise-form__summary"
                name="summary"
                class="exercise-form__input"
                placeholder="Pequena descrição sintetizada do desafio para os cards da homepage"
                required
              />
            </div>

            <div class="exercise-form__group">
              <label for="exercise-form__author-email" class="exercise-form__label"
                >Email do autor *</label
              >
              <input
                type="email"
                id="exercise-form__author-email"
                name="author_email"
                class="exercise-form__input"
                placeholder="voce@exemplo.com"
                required
                maxlength="254"
              />
            </div>

            <div class="exercise-form__group">
              <label
                for="exercise-form__difficulty"
                class="exercise-form__label"
                >Nível de Dificuldade *</label
              >
              <select
                id="exercise-form__difficulty"
                name="difficulty"
                class="exercise-form__select"
                required
              >
                <option value="Fácil">FÁCIL</option>
                <option value="Médio" selected>MÉDIO</option>
                <option value="Difícil">DIFÍCIL</option>
              </select>
            </div>

            <div class="exercise-form__group">
              <label for="exercise-form__image" class="exercise-form__label"
                >Imagem de Capa (Opcional)</label
              >
              <input
                type="file"
                id="exercise-form__image"
                name="image"
                class="exercise-form__file-input"
                accept="image/*"
              />
              <div
                id="exercise-form__image-preview-container"
                class="exercise-form__image-preview-container"
              >
                <img
                  id="exercise-form__image-preview"
                  class="exercise-form__image-preview"
                  src=""
                  alt="Preview"
                />
              </div>
            </div>

            <div class="exercise-form__group">
              <label class="exercise-form__label"
                >Stacks / Tecnologias Relacionadas</label
              >
              <input
                class="exercise-form__taxonomy-search"
                type="search"
                data-taxonomy-search="stacks"
                placeholder="Pesquisar stack..."
                aria-label="Pesquisar stack"
              />
              <div
                id="exercise-form__stacks-checkbox-list"
                class="exercise-form__checkbox-list"
              >
                <!-- Populated dynamically via JS -->
              </div>
            </div>

            <div class="exercise-form__group">
              <label class="exercise-form__label"
                >Tags / Tópicos de Conhecimento</label
              >
              <input
                class="exercise-form__taxonomy-search"
                type="search"
                data-taxonomy-search="tags"
                placeholder="Pesquisar tag..."
                aria-label="Pesquisar tag"
              />
              <div
                id="exercise-form__tags-checkbox-list"
                class="exercise-form__checkbox-list"
              >
                <!-- Populated dynamically via JS -->
                <p>Não há nada...</p>
              </div>
            </div>

            <div class="exercise-form__group exercise-form__group--statement">
              <div class="exercise-form__statement-header">
                <label
                  for="exercise-form__statement"
                  class="exercise-form__label"
                  >Enunciado Completo (Markdown / HTML) *</label
                >
                <button
                  type="button"
                  id="exercise-form__insert-code-template"
                  class="exercise-form__insert-code"
                >
                  + Inserir bloco de código
                </button>
              </div>
              <textarea
                id="exercise-form__statement"
                name="statement"
                class="exercise-form__textarea"
                placeholder="Escreva o enunciado completo do exercício em Markdown ou HTML semântico..."
                required
              ></textarea>
            </div>

            <div class="exercise-form__group">
              <label
                for="exercise-form__attachments"
                class="exercise-form__label"
                >Anexar Arquivos do Exercício (Código, PDF, ZIP)</label
              >
              <input
                type="file"
                id="exercise-form__attachments"
                name="attachments"
                class="exercise-form__file-input"
                multiple
                accept=".txt,.pdf,.zip,.rar,.json,.sql,.py,.cpp,.c,.java,.js,.html,.css,.md"
              />
              <p class="exercise-form__hint">
                Permitidos: ZIP, PDF, TXT, JSON, SQL, código fonte (Máx: 10MB
                por arquivo).
              </p>

              <div
                id="exercise-form__existing-attachments-container"
                class="exercise-form__existing-attachments"
              >
                <label class="exercise-form__label">Anexos Existentes:</label>
                <div
                  id="exercise-form__existing-attachments-list"
                  class="exercise-form__existing-attachments-list"
                ></div>
              </div>
            </div>
          </div>

          <div class="exercise-form__actions">
            <a href="/" class="exercise-form__cancel-button">Cancelar</a>
            <button
              type="submit"
              id="exercise-form__save"
              class="exercise-form__save-button"
            >
              Enviar exercício
            </button>
          </div>
        </form>
      </div>
    </main>

    <div id="toast__container"></div>

    <script src="/js/mainScript.js"></script>
    <script src="/js/sendExerxiseForm.js"></script>
  </body>
</html>
