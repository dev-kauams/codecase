<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CodeCase</title>
    <meta name="description" content="Plataforma medieval de exercícios de programação. Explore, filtre por stack ou nível de dificuldade por @dev-kauams.">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>

    <header>
        <div class="home__header-items">
            <nav>
                <a href="/admin/login" id="home__admin-link">
                    <img src="/images/admin-icon.svg" alt="Administração">
                </a>
            </nav>
            <div></div> <!-- div vazia para o space-between -->
        </div>
    </header>

    <main class="home">
        <section class="home__hero">
            <div class="home__title">
                <h1 data-text="CODECASE">CODECASE</h1>
                <svg width="0" height="0" style="position:absolute">
                    <filter id="home__sketch-filter">
                        <feTurbulence type="fractalNoise" baseFrequency="0.015 0.04" numOctaves="2" seed="7" result="noise"/>
                        <feDisplacementMap in="SourceGraphic" in2="noise" scale="5"/>
                    </filter>
                </svg>
                <div class="home__title-images">
                    <img src="/images/set-square-title.svg" alt="">
                    <img src="/images/brain-title.svg" alt="">
                </div>
            </div>

                <div class="home__actions">
                    <button>Ver exercícios</button>
                    <button onclick="window.open('https://github.com/dev-kauams/codecase', '_blank');">Abrir repositório</button>
                </div>
        </section>

        <section id="home__filter-panel">
            <form id="home__filter-form" onsubmit="event.preventDefault();">
                    <div class="home__filter-search">
                        <label for="home__search-input">Pesquisa Textual</label>
                        <input type="text" id="home__search-input" placeholder="Pesquisar por título, palavra-chave ou tag...">
                    </div>

                    <div>
                        <label for="difficulty-select">Dificuldade</label>
                        <select id="difficulty-select">
                            <option value="">-- TODAS --</option>
                            <option value="Fácil">FÁCIL</option>
                            <option value="Médio">MÉDIO</option>
                            <option value="Difícil">DIFÍCIL</option>
                        </select>
                    </div>

                    <div>
                        <label for="stack-select">Stack / Tech</label>
                        <select id="stack-select">
                            <option value="">-- TODAS --</option>
                            <!-- Populated dynamically via JS -->
                        </select>
                    </div>

                    <div>
                        <label for="tag-select">Tag / Tópico</label>
                        <select id="tag-select">
                            <option value="">-- TODAS --</option>
                            <!-- Populated dynamically via JS -->
                        </select>
                    </div>

                    <div>
                        <button type="button" id="home__clear-filters">Limpar Filtros</button>
                    </div>
    
            </form>
        </section>

        <div>
            <span id="home__results-count">Carregando exercícios...</span>
            <span id="home__active-filter">Filtro: Todos</span>
        </div>

        <section id="home__exercises-grid">

        </section>

    </main>

    <footer class="home__footer">
        <div>
            <p>CODECASE</p>
            <p>Desenvolvido por <strong><a href="https://github.com/dev-kauams" target="_blank">@dev-kauams</a></strong></p>
        </div>
    </footer>

    <div id="toast__container"></div>

    <script src="/js/main.js"></script>
    <script src="/js/filters.js"></script>
</body>
</html>
