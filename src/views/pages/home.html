<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CodeCase</title>
    <meta name="description" content="Plataforma medieval de exercícios de programação. Explore, filtre por stack ou nível de dificuldade por @dev-kauams.">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>

    <header>
        <div class="header-items">
            <nav>
                <a href="/admin/login" id="nav-admin-link">
                    <img src="/images/admin_icon.svg" alt="Administração">
                </a>
            </nav>
            <div></div> <!-- div vazia para o space-between -->
        </div>
    </header>

    <main class="main-home">
        <section class="section-home">
                <h1 data-text="CODECASE">CODECASE</h1>

                <svg width="0" height="0" style="position:absolute">
                    <filter id="rabiscado">
                        <feTurbulence type="fractalNoise" baseFrequency="0.015 0.04" numOctaves="2" seed="7" result="noise"/>
                        <feDisplacementMap in="SourceGraphic" in2="noise" scale="5"/>
                    </filter>
                </svg>

                <div class="home-button">
                    <button>Ver exercícios</button>
                    <button>Abrir repositório</button>
                </div>
        </section>

        <section id="filter-panel">
            <form id="filter-form" onsubmit="event.preventDefault();">
                    <div class="filter-panel-search">
                        <label for="search-input">Pesquisa Textual</label>
                        <input type="text" id="search-input" placeholder="Pesquisar por título, palavra-chave ou tag...">
                    </div>

                    <div>
                        <label for="difficulty-select">Dificuldade</label>
                        <select id="difficulty-select">
                            <option value="">-- TODAS --</option>
                            <option value="Fácil">FÁCIL</option>
                            <option value="Médio">MÉDIO</option>
                            <option value="Difícil">DIFÍCIL</option>
                        </select>
                    </div>

                    <div>
                        <label for="stack-select">Stack / Tech</label>
                        <select id="stack-select">
                            <option value="">-- TODAS --</option>
                            <!-- Populated dynamically via JS -->
                        </select>
                    </div>

                    <div>
                        <label for="tag-select">Tag / Tópico</label>
                        <select id="tag-select">
                            <option value="">-- TODAS --</option>
                            <!-- Populated dynamically via JS -->
                        </select>
                    </div>

                    <div>
                        <button type="button" id="btn-clear-filters">Limpar Filtros</button>
                    </div>
    
            </form>
        </section>

        <div>
            <span id="results-count-text">Carregando exercícios...</span>
            <span id="active-filter-badge">Filtro: Todos</span>
        </div>

        <section id="exercises-grid">

        </section>

    </main>

    <footer class="footer-home">
        <div>
            <p>CODECASE</p>
            <p>Desenvolvido por <strong>@dev-kauams</strong></p>
        </div>
    </footer>

    <div id="toast-container"></div>

    <script src="../../../public/js/main.js"></script>
    <script src="/js/filters.js"></script>
</body>
</html>
