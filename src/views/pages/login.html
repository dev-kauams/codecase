<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CodeCase</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>

    <div>
        <div">

            <div>
                <a href="/">
                    <span>CODECASE</span>
                </a>
                <h2>Administração</h2>
                <p>Entre com suas credenciais autorizadas</p>
            </div>

            <div id="login-error-alert"></div>

            <form id="login-form">
                <div>
                    <label for="username">Usuário Administrador</label>
                    <input type="text" id="username" name="username" placeholder="Ex: admin" required autofocus>
                </div>

                <div>
                    <label for="password">Senha de Acesso</label>
                    <input type="password" id="password" name="password" placeholder="••••••••" required>
                </div>

                <div>
                    <button type="submit" id="btn-login-submit">Entrar</button>
                </div>
            </form>

            <div>
                <a href="/">Voltar à página inicial</a>
            </div>

        </div>
    </div>

    <script src="/js/main.js"></script>
    <script>
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            const errorAlert = document.getElementById('login-error-alert');
            const submitBtn = document.getElementById('btn-login-submit');

            errorAlert.style.display = 'none';
            submitBtn.disabled = true;
            submitBtn.innerText = '[ VERIFICANDO CREDENCIAIS... ]';

            try {
                const res = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                const data = await res.json();

                if (!res.ok || !data.success) {
                    throw new Error(data.error || 'Falha ao autenticar.');
                }

                showToast('Autenticação bem-sucedida! Redirecionando...');
                setTimeout(() => {
                    window.location.href = '/admin/dashboard';
                }, 600);

            } catch (err) {
                errorAlert.innerText = 'Alerta: ' + err.message;
                errorAlert.style.display = 'block';
                submitBtn.disabled = false;
                submitBtn.innerText = 'Logar';
            }
        });
    </script>
</body>
</html>
