<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CodeCase - Detalhes do Pergaminho</title>
    <meta name="description" content="Visualização detalhada do desafio de programação no CodeCase por @dev-kauams.">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>

    <header>
        <div>
            <a href="/">
                <span>CODECASE</span>
            </a>
            <nav>
                <a href="/">VOLTAR à HOME</a>
            </nav>
        </div>
    </header>

    <main>
        <div>
            <div>
                <div>
                    <div>
                        <span id="ex-id-badge" style="font-size: 1.1rem;">EXERCÍCIO #---</span>
                        <h1 id="ex-title">Carregando exercício...</h1>
                    </div>
                    <div id="ex-difficulty-badge">
                    </div>
                </div>

                <div>
                    <div>Datado de: <strong id="ex-date">--/--/----</strong></div>
                    <div>|</div>
                    <div id="ex-stacks-container"></div>
                </div>

                <div id="ex-tags-container"></div>

                <div id="ex-image-wrapper">
                    <img id="ex-image" src="" alt="Imagem do Exercício">
                </div>

                <div id="ex-summary">Resumo do exercício...</div>

                <div id="ex-statement">
                    <!-- Markdown/HTML content injected here -->
                </div>

                <div id="attachments-section" style="display: none;">
                    <h3>[ ANEXOS &amp; RECURSOS ]</h3>
                    <div id="attachments-list">
                        <!-- List of downloadable attachments -->
                    </div>
                </div>

            </div>
        </div>
    </main>

    <footer>
        <div>
            <p>CODECASE &copy; 2026 — @dev-kauams</p>
        </div>
    </footer>

    <script src="/js/main.js"></script>
    <script src="/js/exercise-detail.js"></script>
</body>
</html>
