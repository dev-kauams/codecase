<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CodeCase - Detalhes do Pergaminho</title>
    <meta name="description" content="Visualização detalhada do desafio de programação no CodeCase por @dev-kauams.">
    <link rel="stylesheet" href="/css/main.css">
    <link rel="stylesheet" href="/css/retro-grid.css">
    <link rel="stylesheet" href="/css/components.css">
</head>
<body>

    <header>
        <div>
            <a href="/">
                <span>⚔</span>
                <span>CODECASE</span>
            </a>
            <nav>
                <a href="/">VOLTAR à HOME</a>
            </nav>
        </div>
    </header>

    <main>
        <div>
            <div>
                <div>
                    <div>
                        <span id="ex-id-badge" style="font-size: 1.1rem;">EXERCÍCIO #---</span>
                        <h1 id="ex-title" style="font-family: var(--font-display); font-size: 1.8rem; color: var(--color-accent); margin-top: 6px; letter-spacing: 1px;">Carregando pergaminho...</h1>
                    </div>
                    <div id="ex-difficulty-badge">
                        <!-- Badge dynamically inserted -->
                    </div>
                </div>

                <div style="display: flex; flex-wrap: wrap; gap: 16px; margin-bottom: 24px; align-items: center; font-size: 0.85rem; color: var(--color-text-muted); font-family: var(--font-mono);">
                    <div>Datado de: <strong id="ex-date" style="color: var(--color-text);">--/--/----</strong></div>
                    <div>|</div>
                    <div id="ex-stacks-container" style="margin-bottom: 0;"></div>
                </div>

                <div id="ex-tags-container" style="margin-bottom: 24px;"></div>

                <div id="ex-image-wrapper" style="display: none; margin-bottom: 24px;">
                    <img id="ex-image" src="" alt="Imagem do Exercício" style="max-width: 100%; height: auto; border: 3px double var(--color-border-dim);">
                </div>

                <div id="ex-summary" style="background: var(--color-bg); border-left: 3px solid var(--color-border); padding: 12px 16px; margin-bottom: 24px; font-style: italic; color: var(--color-text-muted); font-family: var(--font-body);">
                    Resumo do exercício...
                </div>

                <div id="ex-statement">
                    <!-- Markdown/HTML content injected here -->
                </div>

                <div id="attachments-section" style="display: none;">
                    <h3 style="font-family: var(--font-display); color: var(--color-gold); font-size: 0.95rem; text-transform: uppercase; letter-spacing: 1px;">
                        [ PERGAMINHOS ANEXOS &amp; RECURSOS ]
                    </h3>
                    <div id="attachments-list">
                        <!-- List of downloadable attachments -->
                    </div>
                </div>

            </div>
        </div>
    </main>

    <footer>
        <div>
            <p>CODECASE &copy; 2026 — @dev-kauams</p>
        </div>
    </footer>

    <script src="/js/main.js"></script>
    <script src="/js/exercise-detail.js"></script>
</body>
</html>
