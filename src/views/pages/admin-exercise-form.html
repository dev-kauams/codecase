<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CodeCase</title>
    <link rel="stylesheet" href="/css/style.css">

</head>
<body>

    <header>
        <div>
            <a href="/">
                <span>⚔</span>
                <span>CODECASE</span>
            </a>
            <nav>
                <a href="/admin/dashboard">← VOLTAR AO DASHBOARD</a>
            </nav>
        </div>
    </header>

    <main>
        <div>

            <div>
                <h1 id="form-heading-title">
                    [ NOVO EXERCÍCIO ]
                </h1>
                <p>Preencha o enunciado, selecione as tecnologias e anexe arquivos complementares.</p>
            </div>

            <form id="exercise-editor-form" enctype="multipart/form-data">
                <input type="hidden" id="exercise-id" name="exercise_id">

                <div>
                    <div>
                        <label for="form-title">Título do Exercício *</label>
                        <input type="text" id="form-title" name="title" placeholder="Ex: Algoritmo de Busca Binária" required>
                    </div>

                    <div>
                        <label for="form-summary">Resumo Curto *</label>
                        <input type="text" id="form-summary" name="summary" placeholder="Pequena descrição sintetizada do desafio para os cards da homepage" required>
                    </div>

                    <div>
                        <label for="form-difficulty">Nível de Dificuldade *</label>
                        <select id="form-difficulty" name="difficulty" required>
                            <option value="Fácil">FÁCIL</option>
                            <option value="Médio" selected>MÉDIO</option>
                            <option value="Difícil">DIFÍCIL</option>
                        </select>
                    </div>

                    <div>
                        <label for="form-image">Imagem de Capa (Opcional)</label>
                        <input type="file" id="form-image" name="image" accept="image/*">
                        <div id="image-preview-container">
                            <img id="image-preview" src="" alt="Preview">
                        </div>
                    </div>

                    <div>
                        <label>Stacks / Tecnologias Relacionadas</label>
                        <div id="stacks-checkbox-list">
                            <!-- Populated dynamically via JS -->
                        </div>
                    </div>

                    <div>
                        <label>Tags / Tópicos de Conhecimento</label>
                        <div id="tags-checkbox-list">
                            <!-- Populated dynamically via JS -->
                        </div>
                    </div>

                    <div>
                        <div>
                            <label for="form-statement">Enunciado Completo (Markdown / HTML) *</label>
                            <button type="button" id="btn-insert-code-template">+ INSERIR BLOCO CÓDIGO</button>
                        </div>
                        <textarea id="form-statement" name="statement" placeholder="Escreva o enunciado completo do exercício em Markdown ou HTML semântico..." required></textarea>
                    </div>

                    <div>
                        <label for="form-attachments">Anexar Arquivos do Exercício (Código, PDF, ZIP)</label>
                        <input type="file" id="form-attachments" name="attachments" multiple accept=".txt,.pdf,.zip,.rar,.json,.sql,.py,.cpp,.c,.java,.js,.html,.css,.md">
                        <param>Permitidos: ZIP, PDF, TXT, JSON, SQL, código fonte (Máx: 10MB por arquivo).</p>

                        <div id="existing-attachments-container" style="margin-top: 12px; display: none;">
                            <label>Anexos Existentes:</label>
                            <div id="existing-attachments-list"></div>
                        </div>
                    </div>

                </div>

                <div>
                    <a href="/admin/dashboard">[ CANCELAR ]</a>
                    <button type="submit" id="btn-save-exercise">
                        [ SALVAR EXERCÍCIO ]
                    </button>
                </div>
            </form>

        </div>
    </main>

    <div id="toast-container"></div>

    <script src="/js/main.js"></script>
    <script src="/js/admin-form.js"></script>
</body>
</html>
